name: Docker Publish (GHCR)

# 自用版：构建 linux/amd64 镜像并推送到 GitHub Container Registry
# 用法：Actions 页面 → 左侧 "Docker Publish (GHCR)" → Run workflow
# 产物：ghcr.io/<你的用户名小写>/antigravity-manager:<tag>
#
# 说明：
# - 只构建 amd64（适配 x86 路由器），不构建 arm64，省一半时间
# - 使用仓库自带的 docker/Dockerfile（前端与后端都在构建阶段从源码编译）
# - 登录 GHCR 用的是内置 GITHUB_TOKEN，无需额外配置任何 secret

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（默认 latest）'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build linux/amd64 & push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 的镜像名必须全小写，而仓库属主可能是 Adolph-Adolf 这种带大写的
      - name: Compute image name and short sha
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/antigravity-manager" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "构建镜像: ghcr.io/${OWNER_LC}/antigravity-manager"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ inputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=4.7.5

      - name: Summary
        run: |
          echo "### 镜像已推送 :whale:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.meta.outputs.image }}:${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
